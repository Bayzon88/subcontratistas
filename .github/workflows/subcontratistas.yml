# CI for the subcontratistas monthly consolidation app.
#
# Two things changed in the rework (05-implementation-plan.md Phase 0 task 6, Phase 6 task 6):
#   1. `npm test` now runs between install and deploy. There were no tests before, which is
#      how the defects in 02-shortcomings.md survived for months.
#   2. pm2 is restarted BY NAME. `pm2 restart 0` restarts process *index* 0, whatever that
#      happens to be on the box that day (BUG-49).
name: Node.js CI

on:
  push:
    branches: ["main", "rework"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Pinned for the same reason as deploy.yml: with a bare `self-hosted` label a push
    # to main could pm2-start the app on whichever runner is idle, including the Pi
    # that no longer serves it.
    runs-on: [self-hosted, pn-60b]

    strategy:
      matrix:
        # config.js declares engines.node >=22; the code is developed on 24.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci

      # The gate. Fixture corpus + pure-function case tables + structural assertions on the
      # generated workbook. With no historical baseline (05 section 4.6), this is one of the
      # only two things proving the pipeline is correct - the other is the parallel run.
      - run: npm test

  deploy:
    needs: test
    runs-on: [self-hosted, pn-60b]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci --omit=dev

      # Restart by NAME, and start it if it is not registered yet.
      - run: pm2 describe subcontratistas > /dev/null 2>&1 && pm2 restart subcontratistas --update-env || pm2 start src/server.js --name subcontratistas
      - run: pm2 save
