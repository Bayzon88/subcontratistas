# Deploy to the box the self-hosted runner lives on.
#
# The runner needs docker and permission to use it (the runner user in the `docker`
# group); it does NOT need Node installed - the tests run inside the image that is
# about to be deployed, so what is tested is exactly what is served.
#
# This replaces the pm2 path in subcontratistas.yml for the production branch.

name: Deploy production

on:
  push:
    branches: ["production"]
  workflow_dispatch:

# Never let two deploys race over the same container name.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: subcontratistas
  CONTAINER: subcontratistas
  # Loopback-only, for debugging on the box. Traefik does NOT use this - it reaches the
  # container over TRAEFIK_NETWORK on APP_PORT. Nothing external depends on it.
  HOST_PORT: "3000"
  # config.js: PORT defaults to 50001. This is the port Traefik connects to.
  APP_PORT: "50001"

  # --- Traefik integration -------------------------------------------------------
  # entrypoint, resolver and the <subdomain>.<domain> host pattern all match the
  # existing prometheus service. TRAEFIK_NETWORK must be the network Traefik itself is
  # attached to or discovery silently finds nothing.
  #
  # DOMAIN is a repository variable (Settings > Secrets and variables > Actions >
  # Variables), not a literal here - the same single source of truth the homelab
  # compose stack interpolates as ${DOMAIN}. run-container.sh fails loudly if it is
  # unset rather than deploying a route for "subcontratistas.".
  DOMAIN: ${{ vars.DOMAIN }}
  APP_SUBDOMAIN: subcontratistas
  TRAEFIK_NETWORK: homelab_default
  CERT_RESOLVER: letsencrypt
  # The app ships no authentication of its own; see deploy/run-container.sh. Empty
  # serves it open on the public hostname.
  TRAEFIK_MIDDLEWARES: traefik-auth

jobs:
  deploy:
    # `subs` is the runner on the pn-60b; `subcontratistas` is the one on the Pi
    # (housita). Both also carry the default `self-hosted` label that every runner gets
    # at registration, so a bare `runs-on: self-hosted` matched either and picked
    # whichever was idle first. That was a race, not a target - the first two
    # production deploys both landed on the Pi by luck.
    #
    # `runs-on` matches LABELS, not runner names, so the pn-60b runner needs a label
    # `subs` added alongside its name for this to resolve.
    #
    # The machine is part of the deploy contract here, for three reasons:
    #   1. Traefik and Portainer live on the pn-60b. A container started on the Pi is
    #      invisible to them - a different Docker daemon entirely.
    #   2. The image is built on the runner that deploys it, and the two boxes are
    #      different architectures (Pi is ARM64, pn-60b is x86_64). The images are not
    #      interchangeable.
    #   3. `Record the running image` and `$IMAGE:latest` both read the LOCAL daemon,
    #      so rollback only works if every deploy lands on the same box.
    runs-on: [self-hosted, subs]

    steps:
      - uses: actions/checkout@v4

      # Before the build and the test suite, because a missing DOMAIN or a wrong
      # network is knowable in a second and otherwise surfaces ninety seconds later.
      # Failing here also skips the swap, which is what keeps the rollback step from
      # reporting a failure for a deploy that never touched the running container.
      - name: Check the deploy configuration
        run: deploy/run-container.sh --check

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      # The gate. Fixture corpus + pure-function case tables + structural assertions on
      # the generated workbook, run in the built image. A failure here stops the deploy
      # and leaves the currently running container untouched.
      - name: Run the test suite inside the image
        run: docker run --rm --init "$IMAGE:${{ github.sha }}" npm test

      # Remember what is serving right now so a failed health check can put it back.
      - name: Record the running image
        id: previous
        run: |
          prev="$(docker inspect --format '{{.Image}}' "$CONTAINER" 2>/dev/null || true)"
          echo "image=$prev" >> "$GITHUB_OUTPUT"
          echo "previous image: ${prev:-none}"

      - name: Swap the container
        id: swap
        run: deploy/run-container.sh "$IMAGE:${{ github.sha }}"

      - name: Wait for the container to report healthy
        id: health
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)"
            case "$status" in
              healthy) echo "healthy after ${i}0s"; exit 0 ;;
              unhealthy) echo "container reported unhealthy"; exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for health (last status: ${status:-unknown})"
          exit 1

      - name: Show logs on failure
        if: failure() && steps.swap.outcome != 'skipped'
        run: docker logs --tail 200 "$CONTAINER" || true

      # Only after a swap was actually attempted - a build or test failure leaves the
      # running container untouched and must not restart it. If there was no previous
      # image (first deploy) there is nothing to roll back to.
      - name: Roll back to the previous image
        if: failure() && steps.swap.outcome != 'skipped' && steps.previous.outputs.image != ''
        run: |
          deploy/run-container.sh "${{ steps.previous.outputs.image }}"
          echo "rolled back to ${{ steps.previous.outputs.image }}"

      # Untagged layers from earlier builds only. Named images are left alone so the
      # rollback target above stays on disk.
      - name: Prune dangling images
        if: always()
        run: docker image prune -f
